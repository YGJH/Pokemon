[package]
name = "ptcg-search"
version = "0.1.0"
edition = "2021"
description = "MCTS search planner for Pokemon TCG AI Battle, backed by libcg.so"

[lib]
crate-type = ["cdylib"]
name = "ptcg_search"

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rayon = "1"

[build-dependencies]
cc = "1"
